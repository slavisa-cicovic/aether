server:
  port: 8082

spring:
  application:
    name: user-management

  datasource:
    url: jdbc:mysql://localhost:3306/aethernet_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: your_db_username
    password: your_db_password

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate.format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  issuer: aether-user-management
  secret: U3VwZXJTZWNyZXRLZXlGb3JBZXRoZXJOZXQhMjM0NTY3OA==
  expiration-minutes: 15
  refresh-expiration-days: 30

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

app:
  admin:
    seed-enabled: true
    email: admin@local
    password: admin
    first-name: System
    last-name: Administrator
    lang: en

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
