server:
  port: 8080
  servlet:
    context-path: /v1

spring:
  config:
    import: optional:classpath:application-common.yml
  application:
    name: aether-voice-gateway
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db.aethernet.com}:3306/aethernet_voice
    username: UNAME
    password: PWD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  auth:
    mode: ${AUTH_MODE:JWT}
    dummy:
      token: ${DUMMY_TOKEN:dummy-voice-agent-token}
    jwt:
      secret: ${JWT_SECRET:U3VwZXJTZWNyZXRLZXlGb3JBZXRoZXJOZXQhMjM0NTY3OA==}
      issuer: ${JWT_ISSUER:aether-user-management}
  cors:
    allowed-origins:
      - "http://localhost:3000" # react dev server
      - "https://frontend.com"  # production frontend URL
    allowed-methods:
      - "GET"
      - "POST" 
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    exposed-headers:
      - "X-Transaction-ID"
      - "X-Session-ID"
      - "X-Request-ID"
    allow-credentials: true
    max-age: 3600

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{transactionId}] - %msg%n"
  level:
    com.aethernet.voicegateway: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

springdoc:
  api-docs:
    path: /api-docs  # Sada će biti /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v1/api-docs  # 👈 OVO JE KLJUČNO!
    config-url: /v1/api-docs/swagger-config
    urls:
      - url: /v1/api-docs
        name: AetherVoice API
